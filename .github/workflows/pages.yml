name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build # tự chạy validate + pack từ data/ rồi build
        env:
          VITE_SYNC_URL: ${{ vars.SYNC_URL }} # địa chỉ Worker đồng bộ (Settings → Variables)
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      # Bước deploy đôi khi lỗi tạm thời ("No artifacts named github-pages"): thử lại một lần sau 30 giây.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
